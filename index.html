<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คำนวณบำเหน็จบำนาญ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
<h1>คำนวณบำเหน็จบำนาญข้าราชการ</h1>

<label>ประเภท</label>
<select id="type">
<option value="gpf">สมาชิก กบข.</option>
<option value="normal">ไม่เป็นสมาชิก กบข.</option>
</select>

<label>วันที่บรรจุ</label>
<input type="date" id="start">

<label>วันที่ออก/เกษียณ</label>
<input type="date" id="end">

<label>เวลาทวีคูณ (ปี)</label>
<input type="number" id="bonusYears" value="0">

<label>เงินเดือนสุดท้าย</label>
<input type="number" id="salary" value="24440">

<div id="avgBox">
<label>เงินเดือนเฉลี่ย 60 เดือนสุดท้าย</label>
<input type="number" id="avg60" value="22123">
</div>

<button onclick="calc()">คำนวณ</button>

<div id="result"></div>
</div>
<script src="app.js"></script>
</body>
</html>
