<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>คำนวณบำเหน็จบำนาญข้าราชการ</title>

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<div class="container">

<h1>คำนวณบำเหน็จบำนาญข้าราชการ</h1>

<!-- ประเภทสมาชิก -->

<div class="card">

<h2>ข้อมูลพื้นฐาน</h2>

<label>ประเภทสมาชิก</label>

<select id="memberType">

<option value="gpf">
สมาชิก กบข.
</option>

<option value="normal">
ไม่เป็นสมาชิก กบข.
</option>

</select>

<label>วันบรรจุราชการ</label>

<input
type="date"
id="startDate">

<label>วันออกจากราชการ</label>

<input
type="date"
id="endDate">

</div>

<!-- อายุราชการ -->

<div class="card">

<h2>อายุราชการ</h2>

<div id="serviceResult">
0 ปี 0 เดือน 0 วัน
</div>

</div>

<!-- ทวีคูณ -->

<div class="card">

<h2>วันทวีคูณ</h2>

<div class="grid3">

<input
type="number"
id="bonusYear"
placeholder="ปี">

<input
type="number"
id="bonusMonth"
placeholder="เดือน">

<input
type="number"
id="bonusDay"
placeholder="วัน">

</div>

</div>

<!-- รวมอายุราชการ -->

<div class="card">

<h2>รวมอายุราชการ</h2>

<div id="totalServiceResult">
0 ปี 0 เดือน 0 วัน
</div>

<h3>เวลาราชการ</h3>

<div id="serviceDecimal">
0.00 ปี
</div>

</div>

<!-- เงินเดือน -->

<div class="card">

<h2>เงินเดือน</h2>

<label>เงินเดือนสุดท้าย</label>

<input
type="number"
id="lastSalary"
placeholder="เงินเดือนสุดท้าย">

</div>

<!-- เงินเดือนเฉลี่ย -->

<div class="card">

<h2>เงินเดือนเฉลี่ย 60 เดือน</h2>

<label>

<input
type="radio"
name="avgMode"
value="manual"
checked>

กรอกค่าเฉลี่ยเอง

</label>

<label>

<input
type="radio"
name="avgMode"
value="history">

คำนวณจาก 10 งวด

</label>

<!-- กรอกเอง -->

<div id="manualSection">

<input
type="number"
id="avgSalary"
placeholder="เงินเดือนเฉลี่ย 60 เดือน">

</div>

<!-- 10 งวด -->

<div id="historySection">

<button
type="button"
id="generateBtn">

สร้าง 10 งวดอัตโนมัติ

</button>

<div id="salaryPeriods">

</div>

</div>

</div>

<!-- ค่าเฉลี่ย -->

<div class="card">

<h2>ค่าเฉลี่ยที่ใช้คำนวณ</h2>

<div id="avgSalaryDisplay">
0.00 บาท
</div>

</div>

<!-- ผลลัพธ์ -->

<div class="card result-card">

<h2>ผลการคำนวณ</h2>

<div class="result-row">
<span>บำเหน็จ</span>
<span id="gratuityResult">
0.00
</span>
</div>

<div class="result-row">
<span>บำนาญ</span>
<span id="pensionResult">
0.00
</span>
</div>

<div class="result-row">
<span>บำเหน็จดำรงชีพ</span>
<span id="livingGrantResult">
0.00
</span>
</div>

</div>

<!-- ปุ่ม -->

<div class="card">

<div class="button-group">

<button id="printBtn">

พิมพ์รายงาน

</button>

<button id="pdfBtn">

Export PDF

</button>

<button id="clearBtn">

ล้างข้อมูล

</button>

</div>

</div>

</div>

<script src="js/dateCalculator.js"></script>
<script src="js/salaryCalculator.js"></script>
<script src="js/pensionCalculator.js"></script>
<script src="js/app.js"></script>

</body>
</html>
